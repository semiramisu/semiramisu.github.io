[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  TZ = "Asia/Tokyo"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

[[plugins]]
  package = "netlify-plugin-submit-sitemap"

  [plugins.inputs]
    baseUrl = "https://semiramisu.com"
    sitemapPath = "/sitemap-index.xml"
    providers = ["google", "bing"]

# Cache and security headers live in public/_headers (single source of truth).
# Redirects live in public/_redirects.
